; Seeed XIAO ESP32-S3. The host parity test compiles src/signal.cpp with g++.
; esp-dsp 1.8.2 is the formula source for the biquads and Hann window.
; It is an ESP-IDF component, not an Arduino library, so it is not in lib_deps.

[env:seeed_xiao_esp32s3]
platform = espressif32@8.0.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit LSM6DS@4.7.4
  adafruit/Adafruit MPU6050@2.2.9
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit Unified Sensor@1.1.15
  bblanchon/ArduinoJson@7.4.2
build_flags =
  -DTB_IMU_DRIVER=TB_IMU_LSM6DS3
